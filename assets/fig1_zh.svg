<text x="30.0" y="402.0" font-size="10.5" fill="#6b6b6b" font-weight="normal" font-style="italic" text-anchor="start">箭头粗细 ∝ 收录工具数</text>
<path d="M812,197.0 L822,197.0 L822,345.0 L812,345.0" stroke="#c0392b" stroke-width="1.6" fill="none" opacity="1"/>
<text x="600.0" y="402.0" font-size="11.5" fill="#c0392b" font-weight="bold" font-style="normal" text-anchor="middle">层次错位：多数改写 Skill 作用于第②层，而商业检测器测量的是第④层</text>
