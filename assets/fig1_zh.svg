<line x1="900.0" y1="76.0" x2="1180.0" y2="76.0" stroke="#d9d9d9" stroke-width="1"/>
<rect x="400.0" y="92.0" width="400.0" height="62.0" rx="4" fill="#eaf1f8" stroke="#3b6ea8" stroke-width="1.2"/>
<rect x="400.0" y="92.0" width="6.0" height="62.0" rx="2" fill="#3b6ea8" stroke="none" stroke-width="1"/>
<text x="418.0" y="118.0" font-size="14" fill="#3b6ea8" font-weight="bold" font-style="normal" text-anchor="start">① 水印</text>
<text x="418.0" y="138.0" font-size="11.5" fill="#6b6b6b" font-weight="normal" font-style="normal" text-anchor="start">模型提供方在采样时引入的统计偏置</text>
<text x="908.0" y="119.0" font-size="12" fill="#1f1f1f" font-weight="normal" font-style="normal" text-anchor="start">持有密钥的提供方</text>
<text x="908.0" y="135.0" font-size="12" fill="#1f1f1f" font-weight="normal" font-style="normal" text-anchor="start">（SynthID）</text>
<line x1="806.0" y1="123.0" x2="894.0" y2="123.0" stroke="#3b6ea8" stroke-width="1.4" marker-end="url(#ahL1)"/>
<rect x="400.0" y="166.0" width="400.0" height="62.0" rx="4" fill="#fbf0e4" stroke="#d07a2d" stroke-width="1.2"/>
<rect x="400.0" y="166.0" width="6.0" height="62.0" rx="2" fill="#d07a2d" stroke="none" stroke-width="1"/>
<text x="418.0" y="192.0" font-size="14" fill="#d07a2d" font-weight="bold" font-style="normal" text-anchor="start">② 用词与句式</text>
<text x="418.0" y="212.0" font-size="11.5" fill="#6b6b6b" font-weight="normal" font-style="normal" text-anchor="start">套话、破折号、“不是……而是……”、硬凑三段式</text>
<text x="908.0" y="193.0" font-size="12" fill="#1f1f1f" font-weight="normal" font-style="normal" text-anchor="start">人类读者；</text>
<text x="908.0" y="209.0" font-size="12" fill="#1f1f1f" font-weight="normal" font-style="normal" text-anchor="start">规则检测器</text>
<line x1="806.0" y1="197.0" x2="894.0" y2="197.0" stroke="#d07a2d" stroke-width="1.4" marker-end="url(#ahL2)"/>
<rect x="400.0" y="240.0" width="400.0" height="62.0" rx="4" fill="#e8f3ec" stroke="#4e9a6b" stroke-width="1.2"/>
<rect x="400.0" y="240.0" width="6.0" height="62.0" rx="2" fill="#4e9a6b" stroke="none" stroke-width="1"/>
<text x="418.0" y="266.0" font-size="14" fill="#4e9a6b" font-weight="bold" font-style="normal" text-anchor="start">③ 结构与论证</text>
<text x="418.0" y="286.0" font-size="11.5" fill="#6b6b6b" font-weight="normal" font-style="normal" text-anchor="start">模板化段落、程式化论证顺序、主张缺乏证据</text>
<text x="908.0" y="267.0" font-size="12" fill="#1f1f1f" font-weight="normal" font-style="normal" text-anchor="start">有经验的读者；结构级</text>
<text x="908.0" y="283.0" font-size="12" fill="#1f1f1f" font-weight="normal" font-style="normal" text-anchor="start">检测器（StoryScope、IdeaLens）</text>
<line x1="806.0" y1="271.0" x2="894.0" y2="271.0" stroke="#4e9a6b" stroke-width="1.4" marker-end="url(#ahL3)"/>
<rect x="400.0" y="314.0" width="400.0" height="62.0" rx="4" fill="#efecf6" stroke="#7a68a6" stroke-width="1.2"/>
<rect x="400.0" y="314.0" width="6.0" height="62.0" rx="2" fill="#7a68a6" stroke="none" stroke-width="1"/>
<text x="418.0" y="340.0" font-size="14" fill="#7a68a6" font-weight="bold" font-style="normal" text-anchor="start">④ 词元概率分布</text>
<text x="418.0" y="360.0" font-size="11.5" fill="#6b6b6b" font-weight="normal" font-style="normal" text-anchor="start">每个词元在语言模型下的可预测程度</text>
<text x="908.0" y="341.0" font-size="12" fill="#1f1f1f" font-weight="normal" font-style="normal" text-anchor="start">商业检测器（GPTZero、Pangram、</text>
<text x="908.0" y="357.0" font-size="12" fill="#1f1f1f" font-weight="normal" font-style="normal" text-anchor="start">Turnitin、知网、朱雀）</text>
<line x1="806.0" y1="345.0" x2="894.0" y2="345.0" stroke="#7a68a6" stroke-width="1.4" marker-end="url(#ahL4)"/>
<rect x="30.0" y="96.0" width="220.0" height="70.0" rx="4" fill="#f6f6f6" stroke="#a8a8a8" stroke-width="1"/>
<text x="42.0" y="118.0" font-size="13" fill="#1f1f1f" font-weight="bold" font-style="normal" text-anchor="start">修改模型权重</text>
<text x="42.0" y="154.0" font-size="10.5" fill="#6b6b6b" font-weight="normal" font-style="normal" text-anchor="start">如 heretic</text>
<text x="240.0" y="116.0" font-size="11" fill="#6b6b6b" font-weight="normal" font-style="normal" text-anchor="end">n = 1</text>
<path d="M250.0,131.0 C330.0,131.0 312.0,180.0 392.0,180.0" stroke="#d07a2d" stroke-width="1.75" fill="none" opacity="0.55"/>
<text x="388.0" y="183.5" font-size="10" fill="#d07a2d" font-weight="bold" font-style="normal" text-anchor="end">1</text>
<rect x="30.0" y="204.0" width="220.0" height="70.0" rx="4" fill="#f6f6f6" stroke="#a8a8a8" stroke-width="1"/>
<text x="42.0" y="226.0" font-size="13" fill="#1f1f1f" font-weight="bold" font-style="normal" text-anchor="start">生成过程中约束</text>
<text x="42.0" y="262.0" font-size="10.5" fill="#6b6b6b" font-weight="normal" font-style="normal" text-anchor="start">系统提示词、先清点素材再写</text>
<text x="240.0" y="224.0" font-size="11" fill="#6b6b6b" font-weight="normal" font-style="normal" text-anchor="end">n = 3</text>
<path d="M250.0,234.0 C330.0,234.0 312.0,197.0 392.0,197.0" stroke="#d07a2d" stroke-width="1.75" fill="none" opacity="0.55"/>
<text x="388.0" y="200.5" font-size="10" fill="#d07a2d" font-weight="bold" font-style="normal" text-anchor="end">1</text>
<path d="M250.0,244.0 C330.0,244.0 312.0,271.0 392.0,271.0" stroke="#4e9a6b" stroke-width="2.5" fill="none" opacity="0.55"/>
<text x="388.0" y="274.5" font-size="10" fill="#4e9a6b" font-weight="bold" font-style="normal" text-anchor="end">2</text>
<rect x="30.0" y="306.0" width="220.0" height="70.0" rx="4" fill="#f6f6f6" stroke="#a8a8a8" stroke-width="1"/>
<text x="42.0" y="328.0" font-size="13" fill="#1f1f1f" font-weight="bold" font-style="normal" text-anchor="start">成稿后改写</text>
<text x="42.0" y="364.0" font-size="10.5" fill="#6b6b6b" font-weight="normal" font-style="normal" text-anchor="start">改写 Skill、绕检测工具</text>
<text x="240.0" y="326.0" font-size="11" fill="#6b6b6b" font-weight="normal" font-style="normal" text-anchor="end">n = 21</text>
