<text x="370.0" y="231.4" font-size="10" fill="#d07a2d" font-weight="bold" font-style="normal" text-anchor="end">13</text>
<path d="M250.0,341.0 C330.0,341.0 312.0,288.0 392.0,288.0" stroke="#4e9a6b" stroke-width="4.75" fill="none" opacity="0.55"/>
