# Single source of truth for the list. README.md and README_zh.md are generated from this file
# by scripts/build_readme.py; star counts live in data/stars.json (scripts/update_stars.py).
#
# layer:   L1 watermark | L2 wording | L2-3 data-calibrated | L3 structure | L4 distribution
# section: which table the entry appears in (see SECTIONS in build_readme.py)
# timing:  post-hoc (rewrite after drafting) | generation (prevent while writing) | model (change the weights)
# use:     academic | general | fiction | social | tech-doc
# warn:    true = marketed for evading detectors; listed for completeness, not recommended
# name:    optional display name in the README tables (defaults to the repo name)

