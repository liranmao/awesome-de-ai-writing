<rect width="1200" height="430" fill="#ffffff"/>
<text x="20.0" y="34.0" font-size="15" fill="#1f1f1f" font-weight="bold" font-style="normal" text-anchor="start">干预作用于哪一层，以及各层由谁识别</text>
<text x="140.0" y="68.0" font-size="12" fill="#6b6b6b" font-weight="bold" font-style="normal" text-anchor="middle">干预方式（时机）</text>
<line x1="30.0" y1="76.0" x2="250.0" y2="76.0" stroke="#d9d9d9" stroke-width="1"/>
<text x="600.0" y="68.0" font-size="12" fill="#6b6b6b" font-weight="bold" font-style="normal" text-anchor="middle">机器痕迹所在层次</text>
<line x1="400.0" y1="76.0" x2="800.0" y2="76.0" stroke="#d9d9d9" stroke-width="1"/>
